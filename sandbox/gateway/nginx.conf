# The only way in from the host. Every port is bound to 127.0.0.1 in the compose file.
# The gateway is the only container on the "edge" network; everything else sits on
# the internal "sandbox" network with no route out (sandbox-safety.md).
worker_processes 1;
events { worker_connections 512; }

http {
  # Docker's DNS, re-resolved every 5s: services move IPs when they restart or scale,
  # and a stopped service must not stop the gateway from starting.
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 2s;
  access_log off;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 60s;

  # 8080: the shop itself.            8081-8084: service admin endpoints for the engine.
  # 8474: Toxiproxy API.              9090: Prometheus.  3100: Loki.  3000: Grafana.
  server { listen 8080; location / { set $u http://storefront:8080; proxy_pass $u; } }
  server { listen 8081; location / { set $u http://storefront:8080; proxy_pass $u; } }
  server { listen 8082; location / { set $u http://cart:8080;       proxy_pass $u; } }
  server { listen 8083; location / { set $u http://payments:8080;   proxy_pass $u; } }
  server { listen 8084; location / { set $u http://worker:8080;     proxy_pass $u; } }
  server { listen 8474; location / { set $u http://toxiproxy:8474;  proxy_pass $u; } }
  server { listen 9090; location / { set $u http://prometheus:9090; proxy_pass $u; } }
  server { listen 3100; location / { set $u http://loki:3100;       proxy_pass $u; } }
  server { listen 3000; location / { set $u http://grafana:3000;    proxy_pass $u; } }
}
